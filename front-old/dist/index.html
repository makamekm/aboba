<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Aboba Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --surface-light: #141414;
            --primary: #6366f1;
            --primary-light: #818cf8;
            --text: #ffffff;
            --text-secondary: rgba(255,255,255,0.5);
            --border: rgba(255,255,255,0.06);
        }
        
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
        }
        
        .app {
            width: 100%; height: 100%;
            position: relative; overflow: hidden;
            background: var(--bg);
        }
        
        /* ===== DRAWER ===== */
        .drawer {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--surface);
            z-index: 100;
            overflow-y: auto;
            transform: translateX(-100%);
            will-change: transform;
        }
        
        .drawer.open {
            transform: translateX(0);
        }
        
        .drawer.closed {
            transform: translateX(-100%);
        }
        
        .drawer-header {
            padding: 20px 16px;
            padding-top: max(20px, env(safe-area-inset-top));
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .drawer-title { font-size: 22px; font-weight: 700; }
        .drawer-new {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--primary); border: none; color: #fff;
            font-size: 20px; display: flex; align-items: center; justify-content: center;
        }
        
        .chat-item {
            display: flex; align-items: center; padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        .chat-item:active { background: var(--surface-light); }
        .chat-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; margin-right: 12px;
        }
        .chat-info { flex: 1; }
        .chat-name { font-weight: 600; font-size: 15px; }
        .chat-preview { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
        
        /* ===== CHAT SCREEN ===== */
        .chat-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            z-index: 200;
            display: flex; flex-direction: column;
            transform: translateX(0);
            will-change: transform;
        }
        
        .chat-screen.open {
            transform: translateX(100%);
        }
        
        .chat-screen.closed {
            transform: translateX(0);
        }
        
        /* Messages */
        .messages {
            flex: 1; overflow-y: auto;
            padding: 16px; padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: 8px;
        }
        .message { max-width: 80%; margin-bottom: 12px; }
        .message.user { margin-left: auto; }
        .message.ai { margin-right: auto; }
        .bubble {
            padding: 12px 16px; border-radius: 18px;
            font-size: 15px; line-height: 1.4;
        }
        .message.user .bubble { background: var(--primary); color: #fff; }
        .message.ai .bubble { background: var(--surface-light); color: var(--text); }
        .time { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        
        /* Input */
        .input-area {
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
            display: flex; align-items: center; gap: 8px;
        }
        .input-area input {
            flex: 1; background: var(--surface-light);
            border: none; border-radius: 20px;
            padding: 10px 16px; color: var(--text); font-size: 15px;
            outline: none;
        }
        .input-area input::placeholder { color: var(--text-secondary); }
        .send-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--primary); border: none; color: #fff;
            font-size: 18px; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Drawer -->
        <div class="drawer closed" id="drawer">
            <div class="drawer-header">
                <div class="drawer-title">Chats</div>
                <button class="drawer-new" onclick="newChat()">+</button>
            </div>
            <div id="chatList"></div>
        </div>
        
        <!-- Chat -->
        <div class="chat-screen closed" id="chatScreen">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMsg()">
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

    <script>
        // ===== DATA =====
        const chats = [
            { name: 'Aboba AI', avatar: '🤖', msgs: [{t:'Hello! How can I help?',u:false}] },
            { name: 'Code Helper', avatar: '💻', msgs: [{t:'Need help with code?',u:false}] },
            { name: 'Translator', avatar: '🌍', msgs: [{t:'What to translate?',u:false}] },
            { name: 'Creative', avatar: '🎨', msgs: [{t:'Let\'s create something!',u:false}] },
        ];
        let current = 0;
        let drawerOpen = false;
        
        // ===== ELEMENTS =====
        const drawer = document.getElementById('drawer');
        const chatScreen = document.getElementById('chatScreen');
        
        function renderChatList() {
            document.getElementById('chatList').innerHTML = chats.map((c,i) => `
                <div class="chat-item" onclick="selectChat(${i})">
                    <div class="chat-avatar">${c.avatar}</div>
                    <div class="chat-info">
                        <div class="chat-name">${c.name}</div>
                        <div class="chat-preview">${c.msgs[c.msgs.length-1].t}</div>
                    </div>
                </div>
            `).join('');
        }
        
        // ===== JS ANIMATION =====
        let animFrame = null;
        
        // easeOut: fast start, slow end (opening chat — sharp at end)
        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        // easeIn: slow start, fast end (opening drawer — smooth at end)
        function easeInCubic(t) { return t * t * t; }
        
        function animateTo(targetPercent, duration = 80) {
            if (animFrame) cancelAnimationFrame(animFrame);
            
            const startPercent = (chatScreen.getBoundingClientRect().left / window.innerWidth) * 100;
            const startTime = performance.now();
            
            // Opening drawer (chat goes right, drawer appears) = easeOut: fast start, slow end
            // Closing drawer (chat returns, drawer hides) = linear: constant speed
            const easing = targetPercent > startPercent ? easeOutCubic : (t => t);
            
            function step(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / duration, 1);
                const eased = easing(t);
                const current = startPercent + (targetPercent - startPercent) * eased;
                
                drawer.style.transform = `translateX(${current - 100}%)`;
                chatScreen.style.transform = `translateX(${current}%)`;
                
                if (t < 1) {
                    animFrame = requestAnimationFrame(step);
                } else {
                    const isOpen = targetPercent >= 50;
                    drawerOpen = isOpen;
                    if (isOpen) {
                        drawer.classList.remove('closed'); drawer.classList.add('open');
                        chatScreen.classList.remove('closed'); chatScreen.classList.add('open');
                    } else {
                        drawer.classList.remove('open'); drawer.classList.add('closed');
                        chatScreen.classList.remove('open'); chatScreen.classList.add('closed');
                    }
                    drawer.style.transform = '';
                    chatScreen.style.transform = '';
                    animFrame = null;
                }
            }
            
            animFrame = requestAnimationFrame(step);
        }
        
        function openDrawer() {
            drawerOpen = true;
            drawer.classList.remove('closed'); drawer.classList.add('open');
            chatScreen.classList.remove('closed'); chatScreen.classList.add('open');
        }
        
        function closeDrawer() {
            drawerOpen = false;
            drawer.classList.remove('open'); drawer.classList.add('closed');
            chatScreen.classList.remove('open'); chatScreen.classList.add('closed');
        }
        
        // ===== TOUCH =====
        let sx = 0, sy = 0, dragging = false;
        let lastX = 0, lastTime = 0, velocity = 0;
        
        function onTouchStart(e) {
            if (e.touches.length !== 1) return;
            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;
            
            // Cancel any running JS animation
            if (animFrame) {
                cancelAnimationFrame(animFrame);
                animFrame = null;
            }
            
            // Get current visual position
            const rect = chatScreen.getBoundingClientRect();
            const currentX = rect.left;
            const w = window.innerWidth;
            
            // Freeze at current position
            drawer.style.transform = `translateX(${currentX - w}px)`;
            chatScreen.style.transform = `translateX(${currentX}px)`;
            
            // sx = touchX - currentX, so dx=0 means no movement
            sx = touchX - currentX;
            sy = touchY;
            lastX = touchX;
            lastTime = Date.now();
            velocity = 0;
            dragging = true;
        }
        
        function onTouchMove(e) {
            if (!dragging || e.touches.length !== 1) return;
            const x = e.touches[0].clientX;
            const y = e.touches[0].clientY;
            const dx = x - sx;
            const dy = y - sy;
            
            // Cancel if vertical
            if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 20) {
                dragging = false;
                return;
            }
            
            // Calculate velocity
            const now = Date.now();
            const dt = now - lastTime;
            if (dt > 0) velocity = (x - lastX) / dt;
            lastX = x;
            lastTime = now;
            
            const w = window.innerWidth;
            
            // dx is offset by current position (sx = touchX - currentX)
            let p = dx / w;
            p = Math.max(0, Math.min(1, p));
            
            drawer.style.transform = `translateX(${(p * 100) - 100}%)`;
            chatScreen.style.transform = `translateX(${p * 100}%)`;
        }
        
        function onTouchEnd() {
            if (!dragging) return;
            dragging = false;
            
            const currentX = chatScreen.getBoundingClientRect().left;
            const w = window.innerWidth;
            let targetOpen = currentX > w * 0.3;
            
            // Velocity override
            if (Math.abs(velocity) > 0.5) {
                targetOpen = velocity > 0;
            }
            
            animateTo(targetOpen ? 100 : 0, 120);
        }
        
        function onTouchCancel() {
            if (!dragging) return;
            dragging = false;
            
            const currentX = chatScreen.getBoundingClientRect().left;
            const w = window.innerWidth;
            const targetOpen = currentX > w * 0.5;
            
            animateTo(targetOpen ? 100 : 0, 120);
        }
        
        // Attach to both elements
        chatScreen.addEventListener('touchstart', onTouchStart, {passive: true});
        chatScreen.addEventListener('touchmove', onTouchMove, {passive: true});
        chatScreen.addEventListener('touchend', onTouchEnd, {passive: true});
        chatScreen.addEventListener('touchcancel', onTouchCancel, {passive: true});
        
        drawer.addEventListener('touchstart', onTouchStart, {passive: true});
        drawer.addEventListener('touchmove', onTouchMove, {passive: true});
        drawer.addEventListener('touchend', onTouchEnd, {passive: true});
        drawer.addEventListener('touchcancel', onTouchCancel, {passive: true});
        
        // ===== CHAT =====
        function selectChat(i) {
            current = i;
            renderMessages();
            closeDrawer();
        }
        
        function renderMessages() {
            const msgs = chats[current].msgs;
            document.getElementById('messages').innerHTML = msgs.map(m => `
                <div class="message ${m.u ? 'user' : 'ai'}">
                    <div class="bubble">${m.t}</div>
                    <div class="time">Just now</div>
                </div>
            `).join('') + '<div style="height:8px"></div>';
            scrollBottom();
        }
        
        function sendMsg() {
            const input = document.getElementById('msgInput');
            const t = input.value.trim();
            if (!t) return;
            
            chats[current].msgs.push({t, u: true});
            input.value = '';
            renderMessages();
            
            setTimeout(() => {
                const replies = ['Interesting!', 'Tell me more.', 'I see.', 'Got it!', 'Thanks for sharing!'];
                chats[current].msgs.push({t: replies[Math.floor(Math.random()*replies.length)], u: false});
                renderMessages();
            }, 1000);
        }
        
        function newChat() {
            chats.unshift({ name: 'New Chat', avatar: '💬', msgs: [{t:'Hello!',u:false}] });
            renderChatList();
            selectChat(0);
        }
        
        function scrollBottom() {
            const m = document.getElementById('messages');
            m.scrollTop = m.scrollHeight;
        }
        
        // ===== INIT =====
        renderChatList();
        renderMessages();
    </script>
</body>
</html>
