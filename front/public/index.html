<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport"
    content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content" />
  <title>AbobaApp</title>
  <style>
    html,
    body,
    #root {
      width: 100%;
      width: 100vw;
      min-width: 100%;
      min-width: 100vw;
      max-width: 100%;
      max-width: 100vw;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      max-height: 100%;
      max-height: 100vh;
      max-height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
    }

    html,
    body {
      overscroll-behavior-x: none !important;
      overscroll-behavior-y: none !important;
    }

    #root {
      display: flex;
      flex: 1;
    }

    body {
      display: flex;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    textarea {
      outline: none !important;
      box-shadow: none !important;
    }

    textarea:focus {
      outline: none !important;
      box-shadow: none !important;
    }

    textarea::-webkit-scrollbar {
      width: 2px;
    }

    textarea::-webkit-scrollbar-track {
      -webkit-box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.3);
    }

    textarea::-webkit-scrollbar-thumb {
      border-radius: 10px;
      background-color: darkgrey;
      outline: 0px;
    }

    div::-webkit-scrollbar {
      width: 4px;
    }

    div::-webkit-scrollbar-track {
      -webkit-box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.3);
    }

    div::-webkit-scrollbar-thumb {
      border-radius: 10px;
      background-color: darkgrey;
      outline: 0px;
    }
  </style>
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="apple-mobile-web-app-title" content="AbobaApp">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>
  <noscript>
    <form action="" style="background-color:#fff;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999">
      <div style="font-size:18px;font-family:Helvetica,sans-serif;line-height:24px;margin:10%;width:80%">
        <p>Oh no! It looks like JavaScript is not enabled in your browser.</p>
        <p style="margin:20px 0">
          <button type="submit"
            style="background-color:#4630eb;border-radius:100px;border:none;box-shadow:none;color:#fff;cursor:pointer;font-weight:700;line-height:20px;padding:6px 16px">Reload</button>
        </p>
      </div>
    </form>
  </noscript>
  <div id="root"></div>
</body>

</html>
