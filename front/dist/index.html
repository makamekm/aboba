<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aboba Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        :root {
            --bg-primary: #212121;
            --bg-secondary: #2f2f2f;
            --bg-input: #2f2f2f;
            --bg-message-user: #2f2f2f;
            --bg-message-bot: #212121;
            --text-primary: #ffffff;
            --text-secondary: #b4b4b4;
            --accent: #10a37f;
            --accent-hover: #0d8c6d;
            --border: #444444;
            --icon-color: #b4b4b4;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-primary);
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }
        
        html {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: var(--bg-primary);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            overflow: hidden;
        }
        
        .header {
            display: none;
        }
        
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--icon-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            user-select: none;
        }
        
        .icon-btn:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }
        
        /* Chat Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            height: calc(100% - 120px);
        }
        
        .chat-container::-webkit-scrollbar {
            width: 4px;
        }
        
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }
        
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: messageAppear 0.3s ease-out;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            user-select: none;
        }
        
        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .message.bot {
            align-self: flex-start;
        }
        
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }
        
        .avatar.user {
            background: var(--accent);
            color: white;
        }
        
        .avatar.bot {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        
        .message-content {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 16px;
            line-height: 1.5;
            word-wrap: break-word;
            -webkit-text-size-adjust: 100%;
            touch-action: manipulation;
        }
        
        .message.user .message-content {
            background: var(--bg-message-user);
            color: var(--text-primary);
            border-bottom-right-radius: 4px;
        }
        
        .message.bot .message-content {
            background: var(--bg-message-bot);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        
        .message-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            text-align: right;
        }
        
        .message.bot .message-time {
            text-align: left;
        }
        
        /* Typing indicator */
        .typing {
            display: flex;
            gap: 4px;
            padding: 16px;
            align-self: flex-start;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        /* Input Area */
        .input-area {
            flex-shrink: 0;
            background: var(--bg-primary);
            border-top: 1px solid var(--border);
            padding: 8px 12px max(16px, env(safe-area-inset-bottom));
            z-index: 10;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
        }
        
        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 4px;
            transition: border-color 0.2s;
        }
        
        .input-wrapper:focus-within {
            border-color: var(--accent);
        }
        
        .attach-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--icon-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            user-select: none;
        }
        
        .attach-btn:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }
        
        .message-input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 16px; /* Prevent iOS zoom on focus */
            padding: 8px 4px;
            outline: none;
            resize: none;
            max-height: 120px;
            min-height: 36px;
            font-family: inherit;
            transform: scale(1); /* Prevent zoom */
        }
        
        .message-input::placeholder {
            color: var(--text-secondary);
        }
        
        .mode-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            user-select: none;
        }
        
        .mode-toggle:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }
        
        .mode-toggle:active {
            transform: scale(0.95);
        }
        
        .mode-icon {
            transition: all 0.3s ease;
        }
        
        .mode-toggle.voice-mode {
            background: #e94560;
        }
        
        .mode-toggle.voice-mode:hover {
            background: #d63850;
        }
        
        .mode-toggle.video-mode {
            background: #6366f1;
        }
        
        .mode-toggle.video-mode:hover {
            background: #5558e0;
        }
        
        /* Recording indicator */
        .recording-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
            opacity: 0;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        
        .recording .recording-pulse {
            display: block;
        }
        
        /* Send button (shown when text entered) */
        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            user-select: none;
        }
        
        .send-btn:hover {
            background: var(--accent-hover);
        }
        
        .send-btn.visible {
            display: flex;
        }
        
        /* Mode indicator */
        .mode-indicator {
            text-align: center;
            padding: 4px;
            font-size: 12px;
            color: var(--text-secondary);
            height: 20px;
            transition: all 0.3s;
        }
        
        .mode-indicator.active {
            color: var(--accent);
        }
        
        /* New chat button */
        .new-chat-btn {
            position: absolute;
            bottom: max(100px, calc(env(safe-area-inset-bottom) + 80px));
            right: 16px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(16, 163, 127, 0.4);
            transition: all 0.2s;
            z-index: 100;
            touch-action: manipulation;
        }
        
        .new-chat-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(16, 163, 127, 0.5);
        }
        
        /* Scroll to bottom */
        .scroll-bottom {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 100;
        }
        
        .scroll-bottom.visible {
            display: flex;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .app {
                max-width: 100%;
            }
        }
        
        /* Markdown-like styling for messages */
        .message-content pre {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        .message-content code {
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        .message-content p {
            margin: 8px 0;
        }
        
        .message-content p:first-child {
            margin-top: 0;
        }
        
        .message-content p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Chat Messages -->
        <div class="chat-container" id="chatContainer">
            <!-- Fake chat messages will be inserted here -->
        </div>
        
        <!-- Mode Indicator -->
        <div class="mode-indicator" id="modeIndicator"></div>
        
        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <button class="attach-btn" onclick="attachFile()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>
                
                <textarea 
                    class="message-input" 
                    id="messageInput" 
                    placeholder="Message..."
                    rows="1"
                    oninput="handleInput()"
                    onkeydown="handleKeydown(event)"
                ></textarea>
                
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
                
                <button class="mode-toggle" id="modeToggle" onclick="toggleMode()">
                    <div class="recording-pulse"></div>
                    <span class="mode-icon" id="modeIcon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </span>
                </button>
            </div>
        </div>
    </div>
    
    <button class="new-chat-btn" onclick="newChat()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </button>

    <script>
        // Fake chat data
        const fakeMessages = [
            { type: 'bot', text: 'Hello! I\'m Aboba, your AI assistant. How can I help you today?', time: '10:30 AM' },
            { type: 'user', text: 'Hi! Can you explain what this app does?', time: '10:31 AM' },
            { type: 'bot', text: 'This is a chat application built with Kotlin Multiplatform and Rust backend. It features real-time messaging, voice and video capabilities, and a dark mode interface inspired by ChatGPT.', time: '10:31 AM' },
            { type: 'user', text: 'That sounds cool! What technologies are used?', time: '10:32 AM' },
            { type: 'bot', text: 'The frontend uses Kotlin/WASM with Compose Multiplatform for cross-platform UI. The backend is built with Rust using Axum for the API gateway and a separate ping service. It also includes PM2 process management and comprehensive testing.', time: '10:32 AM' },
            { type: 'bot', text: 'Key features include:\n\n• Real-time chat interface\n• Voice message recording\n• Video call integration\n• Health check endpoints\n• Graceful shutdown handling\n• Comprehensive test suite', time: '10:33 AM' },
            { type: 'user', text: 'Can you show me an example of the API?', time: '10:34 AM' },
            { type: 'bot', text: 'Sure! Here\'s a simple example:\n\n<code>POST /api/ping</code>\n<code>{ "message": "Ping" }</code>\n\nResponse:\n<code>{ "response": "Pong" }</code>\n\nThe API also includes health checks at <code>/health</code> for both the gateway and ping service.', time: '10:34 AM' },
            { type: 'user', text: 'Great, thanks for the info!', time: '10:35 AM' },
            { type: 'bot', text: 'You\'re welcome! Feel free to ask if you have any other questions. You can also try the voice or video features by clicking the microphone button in the input area.', time: '10:35 AM' }
        ];
        
        let currentMode = 'text'; // text, voice, video
        let isRecording = false;
        
        // Initialize chat
        function initChat() {
            const container = document.getElementById('chatContainer');
            fakeMessages.forEach((msg, index) => {
                setTimeout(() => {
                    addMessage(msg.type, msg.text, msg.time);
                }, index * 200);
            });
        }
        
        function addMessage(type, text, time) {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${type}`;
            avatar.textContent = type === 'user' ? 'U' : 'A';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = formatText(text);
            
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const wrapper = document.createElement('div');
            wrapper.appendChild(content);
            wrapper.appendChild(timeDiv);
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(wrapper);
            
            container.appendChild(messageDiv);
            scrollToBottom();
        }
        
        function formatText(text) {
            // Simple markdown-like formatting
            return text
                .replace(/\n/g, '<br>')
                .replace(/<code>(.*?)<\/code>/g, '<code>$1</code>');
        }
        
        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }
        
        function handleInput() {
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const modeToggle = document.getElementById('modeToggle');
            
            if (input.value.trim()) {
                sendBtn.classList.add('visible');
                modeToggle.style.display = 'none';
            } else {
                sendBtn.classList.remove('visible');
                modeToggle.style.display = 'flex';
            }
            
            // Auto-resize
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        }
        
        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            addMessage('user', text);
            input.value = '';
            input.style.height = 'auto';
            handleInput();
            
            // Show typing indicator
            showTyping();
            
            // Fake bot response
            setTimeout(() => {
                hideTyping();
                const responses = [
                    'Interesting! Tell me more about that.',
                    'I understand. How can I help you with this?',
                    'That\'s a great question! Let me think...',
                    'Thanks for sharing! Is there anything specific you\'d like to know?',
                    'I see. Would you like me to explain that in more detail?'
                ];
                const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                addMessage('bot', randomResponse);
            }, 1500 + Math.random() * 1000);
        }
        
        function showTyping() {
            const container = document.getElementById('chatContainer');
            const typing = document.createElement('div');
            typing.className = 'typing';
            typing.id = 'typingIndicator';
            typing.innerHTML = `
                <div class="avatar bot">A</div>
                <div style="display: flex; gap: 4px; align-items: center; padding: 12px 16px;">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            container.appendChild(typing);
            scrollToBottom();
        }
        
        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }
        
        function toggleMode() {
            const modeToggle = document.getElementById('modeToggle');
            const modeIcon = document.getElementById('modeIcon');
            const indicator = document.getElementById('modeIndicator');
            
            if (currentMode === 'text') {
                currentMode = 'voice';
                modeToggle.className = 'mode-toggle voice-mode';
                modeIcon.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <polygon points="23 7 16 12 23 17 23 7"></polygon>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                `;
                indicator.textContent = 'Video mode';
                indicator.classList.add('active');
            } else if (currentMode === 'voice') {
                currentMode = 'video';
                modeToggle.className = 'mode-toggle video-mode';
                modeIcon.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                `;
                indicator.textContent = 'Voice mode';
            } else {
                currentMode = 'text';
                modeToggle.className = 'mode-toggle';
                modeIcon.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                `;
                indicator.textContent = '';
                indicator.classList.remove('active');
            }
            
            // Reset after 2 seconds if not voice/video mode
            if (currentMode !== 'text') {
                setTimeout(() => {
                    indicator.classList.remove('active');
                }, 2000);
            }
        }
        
        function attachFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*,video/*,audio/*,.pdf,.doc,.docx,.txt';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    addMessage('user', `📎 Attached: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`);
                    setTimeout(() => {
                        addMessage('bot', `I received your file "${file.name}". In a real implementation, I would process this file for you.`);
                    }, 500);
                }
            };
            input.click();
        }
        
        function newChat() {
            const container = document.getElementById('chatContainer');
            container.innerHTML = '';
            addMessage('bot', 'Hello! I\'m Aboba, your AI assistant. How can I help you today?');
        }
        
        function toggleMenu() {
            alert('Menu would open here - showing chat history and settings');
        }
        
        function shareChat() {
            if (navigator.share) {
                navigator.share({
                    title: 'Aboba Chat',
                    text: 'Check out my conversation with Aboba AI!'
                });
            } else {
                alert('Share dialog would open here');
            }
        }
        
        function showOptions() {
            alert('Options menu:\n• Settings\n• Clear chat\n• Export chat\n• About');
        }
        
        // Initialize
        initChat();
        
        // Handle keyboard resize - prevent viewport shrinking
        function handleKeyboard() {
            const app = document.querySelector('.app');
            const inputArea = document.querySelector('.input-area');
            const chatContainer = document.getElementById('chatContainer');
            
            function updateLayout() {
                const vv = window.visualViewport;
                const viewportHeight = vv ? vv.height : window.innerHeight;
                const viewportWidth = vv ? vv.width : window.innerWidth;
                
                // Set app to exactly the available visual viewport size
                app.style.width = viewportWidth + 'px';
                app.style.height = viewportHeight + 'px';
                app.style.top = (vv ? vv.offsetTop : 0) + 'px';
                app.style.left = (vv ? vv.offsetLeft : 0) + 'px';
                
                // Calculate available space for chat (no header now)
                const inputHeight = inputArea.offsetHeight;
                const availableHeight = viewportHeight - inputHeight;
                
                // Set chat container to fill remaining space
                chatContainer.style.height = availableHeight + 'px';
                chatContainer.style.flex = 'none';
                
                // Ensure input stays at bottom
                inputArea.style.position = 'absolute';
                inputArea.style.bottom = '0';
                inputArea.style.left = '0';
                inputArea.style.right = '0';
                
                // Scroll to bottom
                scrollToBottom();
            }
            
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', updateLayout);
                window.visualViewport.addEventListener('scroll', updateLayout);
            }
            
            window.addEventListener('resize', updateLayout);
            
            // Initial layout
            updateLayout();
            
            // Re-calculate on orientation change
            window.addEventListener('orientationchange', () => {
                setTimeout(updateLayout, 100);
            });
        }
        
        handleKeyboard();
        
        // Handle scroll for "scroll to bottom" button
        const chatContainer = document.getElementById('chatContainer');
        let scrollTimeout;
        chatContainer.addEventListener('scroll', () => {
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                const isNearBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 100;
                // Could show/hide scroll to bottom button here
            }, 100);
        });
    </script>
</body>
</html>
