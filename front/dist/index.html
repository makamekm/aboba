<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aboba Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d0d0d; color: #fff;
        }
        
        .app {
            width: 100%; height: 100%;
            position: relative; overflow: hidden;
        }
        
        /* ===== DRAWER ===== */
        .drawer {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #1a1a1a;
            z-index: 100;
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            will-change: transform;
        }
        
        .drawer.open {
            transform: translateX(0);
        }
        
        .drawer-header {
            padding: 20px 16px;
            padding-top: max(20px, env(safe-area-inset-top));
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .drawer-title { font-size: 22px; font-weight: 700; }
        .drawer-new {
            width: 36px; height: 36px; border-radius: 50%;
            background: #10a37f; border: none; color: #fff;
            font-size: 20px; display: flex; align-items: center; justify-content: center;
        }
        
        .chat-item {
            display: flex; align-items: center; padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }
        .chat-item:active { background: rgba(255,255,255,0.05); }
        .chat-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; margin-right: 12px;
        }
        .chat-info { flex: 1; }
        .chat-name { font-weight: 600; font-size: 15px; }
        .chat-preview { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 2px; }
        
        /* ===== CHAT SCREEN ===== */
        .chat-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0d0d0d;
            z-index: 200;
            display: flex; flex-direction: column;
            transform: translateX(0);
            transition: transform 0.3s ease;
            will-change: transform;
        }
        .chat-screen.open {
            transform: translateX(100%);
        }
        
        /* Messages */
        .messages {
            flex: 1; overflow-y: auto;
            padding: 16px; padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: 8px;
        }
        .message { max-width: 80%; margin-bottom: 12px; }
        .message.user { margin-left: auto; }
        .message.ai { margin-right: auto; }
        .bubble {
            padding: 12px 16px; border-radius: 18px;
            font-size: 15px; line-height: 1.4;
        }
        .message.user .bubble { background: #10a37f; color: #fff; }
        .message.ai .bubble { background: rgba(255,255,255,0.1); color: #fff; }
        .time { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; }
        
        /* Input */
        .input-area {
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; gap: 8px;
        }
        .input-area input {
            flex: 1; background: rgba(255,255,255,0.1);
            border: none; border-radius: 20px;
            padding: 10px 16px; color: #fff; font-size: 15px;
            outline: none;
        }
        .input-area input::placeholder { color: rgba(255,255,255,0.4); }
        .send-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: #10a37f; border: none; color: #fff;
            font-size: 18px; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Drawer -->
        <div class="drawer" id="drawer">
            <div class="drawer-header">
                <div class="drawer-title">Chats</div>
                <button class="drawer-new" onclick="newChat()">+</button>
            </div>
            <div id="chatList"></div>
        </div>
        
        <!-- Chat -->
        <div class="chat-screen" id="chatScreen">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMsg()">
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

    <script>
        // ===== DATA =====
        const chats = [
            { name: 'Aboba AI', avatar: '🤖', msgs: [{t:'Hello! How can I help?',u:false}] },
            { name: 'Code Helper', avatar: '💻', msgs: [{t:'Need help with code?',u:false}] },
            { name: 'Translator', avatar: '🌍', msgs: [{t:'What to translate?',u:false}] },
            { name: 'Creative', avatar: '🎨', msgs: [{t:'Let\'s create something!',u:false}] },
        ];
        let current = 0;
        let drawerOpen = false;
        
        // ===== ELEMENTS =====
        const drawer = document.getElementById('drawer');
        const chatScreen = document.getElementById('chatScreen');
        
        function renderChatList() {
            document.getElementById('chatList').innerHTML = chats.map((c,i) => `
                <div class="chat-item" onclick="selectChat(${i})">
                    <div class="chat-avatar">${c.avatar}</div>
                    <div class="chat-info">
                        <div class="chat-name">${c.name}</div>
                        <div class="chat-preview">${c.msgs[c.msgs.length-1].t}</div>
                    </div>
                </div>
            `).join('');
        }
        
        function openDrawer() {
            drawerOpen = true;
            drawer.classList.add('open');
            chatScreen.classList.add('open');
        }
        
        function closeDrawer() {
            drawerOpen = false;
            drawer.classList.remove('open');
            chatScreen.classList.remove('open');
        }
        
        // ===== TOUCH - works on both chat and drawer =====
        let sx = 0, sy = 0, dragging = false, hasMoved = false;
        let lastX = 0, lastTime = 0, velocity = 0;
        
        function onTouchStart(e) {
            if (e.touches.length !== 1) return;
            sx = e.touches[0].clientX;
            sy = e.touches[0].clientY;
            lastX = sx;
            lastTime = Date.now();
            velocity = 0;
            dragging = true;
            hasMoved = false;
        }
        
        function onTouchMove(e) {
            if (!dragging || e.touches.length !== 1) return;
            const x = e.touches[0].clientX;
            const y = e.touches[0].clientY;
            const dx = x - sx;
            const dy = y - sy;
            
            // Dead zone - ignore tiny movements
            if (!hasMoved && Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
            hasMoved = true;
            
            // Cancel if vertical
            if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 10) {
                dragging = false;
                return;
            }
            
            // Calculate velocity
            const now = Date.now();
            const dt = now - lastTime;
            if (dt > 0) velocity = (x - lastX) / dt;
            lastX = x;
            lastTime = now;
            
            const w = window.innerWidth;
            
            // Swipe RIGHT: drawer comes from left, chat goes right
            if (!drawerOpen && dx > 0) {
                const p = Math.min(dx / w, 1);
                drawer.style.transition = 'none';
                chatScreen.style.transition = 'none';
                drawer.style.transform = `translateX(${(p * 100) - 100}%)`;
                chatScreen.style.transform = `translateX(${p * 100}%)`;
            }
            
            // Swipe LEFT: drawer goes back left, chat comes back
            if (drawerOpen && dx < 0) {
                const p = Math.max(1 + dx / w, 0);
                drawer.style.transition = 'none';
                chatScreen.style.transition = 'none';
                drawer.style.transform = `translateX(${(p * 100) - 100}%)`;
                chatScreen.style.transform = `translateX(${p * 100}%)`;
            }
        }
        
        function onTouchEnd() {
            if (!dragging) return;
            dragging = false;
            
            // Reset inline styles
            drawer.style.transition = '';
            drawer.style.transform = '';
            chatScreen.style.transition = '';
            chatScreen.style.transform = '';
            
            // Velocity check: fast swipe = switch state
            const VELOCITY_THRESHOLD = 0.5; // px/ms
            if (Math.abs(velocity) > VELOCITY_THRESHOLD) {
                if (velocity > 0 && !drawerOpen) openDrawer();
                else if (velocity < 0 && drawerOpen) closeDrawer();
                return;
            }
            
            // Position check
            const rect = chatScreen.getBoundingClientRect();
            if (rect.left > window.innerWidth * 0.3) {
                openDrawer();
            } else {
                closeDrawer();
            }
        }
        
        function onTouchCancel() {
            if (!dragging) return;
            dragging = false;
            
            // Force reset inline styles
            drawer.style.transition = '';
            drawer.style.transform = '';
            chatScreen.style.transition = '';
            chatScreen.style.transform = '';
            
            // Return to nearest stable state
            const rect = chatScreen.getBoundingClientRect();
            if (rect.left > window.innerWidth * 0.5) {
                openDrawer();
            } else {
                closeDrawer();
            }
        }
        
        // Attach to both elements
        chatScreen.addEventListener('touchstart', onTouchStart, {passive: true});
        chatScreen.addEventListener('touchmove', onTouchMove, {passive: true});
        chatScreen.addEventListener('touchend', onTouchEnd, {passive: true});
        chatScreen.addEventListener('touchcancel', onTouchCancel, {passive: true});
        
        drawer.addEventListener('touchstart', onTouchStart, {passive: true});
        drawer.addEventListener('touchmove', onTouchMove, {passive: true});
        drawer.addEventListener('touchend', onTouchEnd, {passive: true});
        drawer.addEventListener('touchcancel', onTouchCancel, {passive: true});
        
        // Handle tab switch / app background
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) onTouchCancel();
        });
        
        // ===== CHAT =====
        function selectChat(i) {
            current = i;
            renderMessages();
            closeDrawer();
        }
        
        function renderMessages() {
            const msgs = chats[current].msgs;
            document.getElementById('messages').innerHTML = msgs.map(m => `
                <div class="message ${m.u ? 'user' : 'ai'}">
                    <div class="bubble">${m.t}</div>
                    <div class="time">Just now</div>
                </div>
            `).join('') + '<div style="height:8px"></div>';
            scrollBottom();
        }
        
        function sendMsg() {
            const input = document.getElementById('msgInput');
            const t = input.value.trim();
            if (!t) return;
            
            chats[current].msgs.push({t, u: true});
            input.value = '';
            renderMessages();
            
            setTimeout(() => {
                const replies = ['Interesting!', 'Tell me more.', 'I see.', 'Got it!', 'Thanks for sharing!'];
                chats[current].msgs.push({t: replies[Math.floor(Math.random()*replies.length)], u: false});
                renderMessages();
            }, 1000);
        }
        
        function newChat() {
            chats.unshift({ name: 'New Chat', avatar: '💬', msgs: [{t:'Hello!',u:false}] });
            renderChatList();
            selectChat(0);
        }
        
        function scrollBottom() {
            const m = document.getElementById('messages');
            m.scrollTop = m.scrollHeight;
        }
        
        // ===== INIT =====
        renderChatList();
        renderMessages();
    </script>
</body>
</html>
