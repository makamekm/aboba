<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aboba Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d0d0d; color: #fff;
        }
        
        /* ===== APP ===== */
        .app {
            width: 100%; height: 100%;
            position: relative; overflow: hidden;
        }
        
        /* ===== DRAWER ===== */
        .drawer {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #1a1a1a;
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .drawer.open { transform: translateX(0); }
        
        .drawer-header {
            padding: 20px 16px;
            padding-top: max(20px, env(safe-area-inset-top));
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .drawer-title { font-size: 22px; font-weight: 700; }
        .drawer-new {
            width: 36px; height: 36px; border-radius: 50%;
            background: #10a37f; border: none; color: #fff;
            font-size: 20px; display: flex; align-items: center; justify-content: center;
        }
        
        .chat-item {
            display: flex; align-items: center; padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }
        .chat-item:active { background: rgba(255,255,255,0.05); }
        .chat-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; margin-right: 12px;
        }
        .chat-info { flex: 1; }
        .chat-name { font-weight: 600; font-size: 15px; }
        .chat-preview { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 2px; }
        
        /* ===== CHAT SCREEN ===== */
        .chat-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0d0d0d;
            z-index: 200;
            display: flex; flex-direction: column;
        }
        
        /* Messages */
        .messages {
            flex: 1; overflow-y: auto;
            padding: 16px; padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: 8px;
        }
        .message { max-width: 80%; margin-bottom: 12px; }
        .message.user { margin-left: auto; }
        .message.ai { margin-right: auto; }
        .bubble {
            padding: 12px 16px; border-radius: 18px;
            font-size: 15px; line-height: 1.4;
        }
        .message.user .bubble { background: #10a37f; color: #fff; }
        .message.ai .bubble { background: rgba(255,255,255,0.1); color: #fff; }
        .time { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; }
        
        /* Input */
        .input-area {
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; gap: 8px;
        }
        .input-area input {
            flex: 1; background: rgba(255,255,255,0.1);
            border: none; border-radius: 20px;
            padding: 10px 16px; color: #fff; font-size: 15px;
            outline: none;
        }
        .input-area input::placeholder { color: rgba(255,255,255,0.4); }
        .send-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: #10a37f; border: none; color: #fff;
            font-size: 18px; display: flex; align-items: center; justify-content: center;
        }
        
        /* Backdrop */
        .backdrop {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 150;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .backdrop.visible { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Drawer -->
        <div class="drawer" id="drawer">
            <div class="drawer-header">
                <div class="drawer-title">Chats</div>
                <button class="drawer-new" onclick="newChat()">+</button>
            </div>
            <div id="chatList"></div>
        </div>
        
        <!-- Backdrop -->
        <div class="backdrop" id="backdrop" onclick="closeDrawer()"></div>
        
        <!-- Chat -->
        <div class="chat-screen" id="chatScreen">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMsg()">
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

    <script>
        // ===== DATA =====
        const chats = [
            { name: 'Aboba AI', avatar: '🤖', msgs: [{t:'Hello! How can I help?',u:false}] },
            { name: 'Code Helper', avatar: '💻', msgs: [{t:'Need help with code?',u:false}] },
            { name: 'Translator', avatar: '🌍', msgs: [{t:'What to translate?',u:false}] },
            { name: 'Creative', avatar: '🎨', msgs: [{t:'Let\'s create something!',u:false}] },
        ];
        let current = 0;
        let drawerOpen = false;
        
        // ===== DRAWER =====
        const drawer = document.getElementById('drawer');
        const backdrop = document.getElementById('backdrop');
        const chatScreen = document.getElementById('chatScreen');
        
        function renderChatList() {
            document.getElementById('chatList').innerHTML = chats.map((c,i) => `
                <div class="chat-item" onclick="selectChat(${i})">
                    <div class="chat-avatar">${c.avatar}</div>
                    <div class="chat-info">
                        <div class="chat-name">${c.name}</div>
                        <div class="chat-preview">${c.msgs[c.msgs.length-1].t}</div>
                    </div>
                </div>
            `).join('');
        }
        
        function openDrawer() {
            drawerOpen = true;
            drawer.classList.add('open');
            backdrop.classList.add('visible');
        }
        
        function closeDrawer() {
            drawerOpen = false;
            drawer.classList.remove('open');
            backdrop.classList.remove('visible');
        }
        
        // ===== TOUCH =====
        let sx = 0, sy = 0, dragging = false;
        
        chatScreen.addEventListener('touchstart', e => {
            if (e.touches.length !== 1) return;
            sx = e.touches[0].clientX;
            sy = e.touches[0].clientY;
            dragging = true;
        }, {passive: true});
        
        chatScreen.addEventListener('touchmove', e => {
            if (!dragging || e.touches.length !== 1) return;
            const dx = e.touches[0].clientX - sx;
            const dy = e.touches[0].clientY - sy;
            
            // Cancel if vertical
            if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 10) {
                dragging = false;
                return;
            }
            
            // Right swipe opens
            if (!drawerOpen && dx > 30) {
                const p = Math.min(dx / window.innerWidth, 1);
                drawer.style.transition = 'none';
                drawer.style.transform = `translateX(${(p * 100) - 100}%)`;
                backdrop.style.opacity = p * 0.5;
            }
            // Left swipe closes
            if (drawerOpen && dx < -30) {
                const p = Math.max(1 + (dx / window.innerWidth), 0);
                drawer.style.transition = 'none';
                drawer.style.transform = `translateX(${(p * 100) - 100}%)`;
                backdrop.style.opacity = p * 0.5;
            }
        }, {passive: true});
        
        function endDrag() {
            if (!dragging) return;
            dragging = false;
            
            // Reset to CSS transition
            drawer.style.transition = '';
            drawer.style.transform = '';
            backdrop.style.opacity = '';
            
            // Snap based on current position
            const rect = drawer.getBoundingClientRect();
            if (rect.left > window.innerWidth * -0.5) {
                openDrawer();
            } else {
                closeDrawer();
            }
        }
        
        chatScreen.addEventListener('touchend', endDrag, {passive: true});
        chatScreen.addEventListener('touchcancel', endDrag, {passive: true});
        
        // ===== CHAT =====
        function selectChat(i) {
            current = i;
            renderMessages();
            closeDrawer();
        }
        
        function renderMessages() {
            const msgs = chats[current].msgs;
            document.getElementById('messages').innerHTML = msgs.map(m => `
                <div class="message ${m.u ? 'user' : 'ai'}">
                    <div class="bubble">${m.t}</div>
                    <div class="time">Just now</div>
                </div>
            `).join('') + '<div style="height:8px"></div>';
            scrollBottom();
        }
        
        function sendMsg() {
            const input = document.getElementById('msgInput');
            const t = input.value.trim();
            if (!t) return;
            
            chats[current].msgs.push({t, u: true});
            input.value = '';
            renderMessages();
            
            // Fake reply
            setTimeout(() => {
                const replies = ['Interesting!', 'Tell me more.', 'I see.', 'Got it!', 'Thanks for sharing!'];
                chats[current].msgs.push({t: replies[Math.floor(Math.random()*replies.length)], u: false});
                renderMessages();
            }, 1000);
        }
        
        function newChat() {
            chats.unshift({ name: 'New Chat', avatar: '💬', msgs: [{t:'Hello!',u:false}] });
            renderChatList();
            selectChat(0);
        }
        
        function scrollBottom() {
            const m = document.getElementById('messages');
            m.scrollTop = m.scrollHeight;
        }
        
        // ===== INIT =====
        renderChatList();
        renderMessages();
    </script>
</body>
</html>
