<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Aboba Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --surface-light: #141414;
            --primary: #6366f1;
            --primary-light: #818cf8;
            --text: #ffffff;
            --text-secondary: rgba(255,255,255,0.5);
            --border: rgba(255,255,255,0.06);
        }
        
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
        }
        
        .app {
            width: 100%; height: 100%;
            position: relative; overflow: hidden;
            background: var(--bg);
        }
        
        /* ===== DRAWER ===== */
        .drawer {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--surface);
            z-index: 100;
            overflow-y: auto;
            transform: translateX(-100%);
            will-change: transform;
        }
        
        .drawer-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px; padding-top: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .drawer-title { font-size: 22px; font-weight: 700; }
        
        .new-chat-btn {
            width: 36px; height: 36px; border-radius: 18px;
            background: var(--primary); display: flex;
            align-items: center; justify-content: center;
            font-size: 20px; color: #fff; cursor: pointer;
        }
        
        .chat-list { padding: 8px 0; }
        
        .chat-item {
            display: flex; align-items: center;
            padding: 12px 16px; cursor: pointer;
            border-bottom: 1px solid var(--border);
        }
        
        .chat-item:hover { background: var(--surface-light); }
        
        .chat-item.active { background: var(--surface-light); }
        
        .avatar {
            width: 48px; height: 48px; border-radius: 24px;
            background: var(--primary); display: flex;
            align-items: center; justify-content: center;
            font-size: 20px; margin-right: 12px; flex-shrink: 0;
        }
        
        .chat-info { flex: 1; min-width: 0; }
        
        .chat-name { font-weight: 600; font-size: 15px; }
        
        .chat-preview {
            font-size: 13px; color: var(--text-secondary);
            margin-top: 2px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        
        /* ===== CHAT SCREEN ===== */
        .chat-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            z-index: 200;
            display: flex; flex-direction: column;
        }
        
        .chat-header {
            display: flex; align-items: center;
            padding: 12px 16px; padding-top: 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        
        .menu-btn {
            width: 40px; height: 40px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; margin-right: 12px; cursor: pointer;
        }
        
        .menu-btn:hover { background: var(--surface-light); }
        
        .chat-header-info { flex: 1; }
        
        .chat-header-name { font-weight: 600; font-size: 16px; }
        
        .chat-header-status { font-size: 13px; color: var(--text-secondary); }
        
        /* ===== MESSAGES ===== */
        .messages {
            flex: 1; overflow-y: auto;
            padding: 16px; padding-top: 20px;
            -webkit-overflow-scrolling: touch;
        }
        
        .message {
            max-width: 80%; margin-bottom: 12px;
            animation: fadeIn 0.2s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user { align-self: flex-end; margin-left: auto; }
        
        .message.ai { align-self: flex-start; }
        
        .bubble {
            padding: 12px; border-radius: 18px;
            font-size: 15px; line-height: 1.4;
            word-wrap: break-word;
        }
        
        .bubble.user { background: var(--primary); color: #fff; }
        
        .bubble.ai { background: var(--surface-light); color: var(--text); }
        
        /* ===== INPUT ===== */
        .input-area {
            display: flex; align-items: center;
            padding: 12px; gap: 8px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        
        .input {
            flex: 1; background: var(--surface-light);
            border: none; border-radius: 20px;
            padding: 10px 16px; color: var(--text);
            font-size: 15px; outline: none;
            font-family: inherit;
        }
        
        .input::placeholder { color: var(--text-secondary); }
        
        .send-btn {
            width: 40px; height: 40px; border-radius: 20px;
            background: var(--primary); display: flex;
            align-items: center; justify-content: center;
            font-size: 18px; color: #fff; cursor: pointer;
            border: none; flex-shrink: 0;
        }
        
        .send-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="app">
        <!-- Drawer -->
        <div class="drawer" id="drawer">
            <div class="drawer-header">
                <div class="drawer-title">Chats</div>
                <div class="new-chat-btn" onclick="newChat()">+</div>
            </div>
            <div class="chat-list" id="chatList"></div>
        </div>
        
        <!-- Chat Screen -->
        <div class="chat-screen" id="chatScreen">
            <div class="chat-header">
                <div class="menu-btn" onclick="openDrawer()">☰</div>
                <div class="chat-header-info">
                    <div class="chat-header-name" id="headerName">Aboba AI</div>
                    <div class="chat-header-status">online</div>
                </div>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" class="input" id="input" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMessage()">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
    
    <script>
        // ===== STATE =====
        let drawerOpen = false;
        let currentChatId = '1';
        let animId = null;
        
        const chats = [
            { id: '1', name: 'Aboba AI', avatar: '🤖', messages: [{id:'1', text:'Hello! How can I help?', isUser:false}] },
            { id: '2', name: 'Code Helper', avatar: '💻', messages: [{id:'2', text:'Need help with code?', isUser:false}] },
            { id: '3', name: 'Translator', avatar: '🌍', messages: [{id:'3', text:'What to translate?', isUser:false}] },
            { id: '4', name: 'Creative', avatar: '🎨', messages: [{id:'4', text:"Let's create something!", isUser:false}] },
        ];
        
        const replies = ['Interesting!', 'Tell me more.', 'I see.', 'Got it!', 'Thanks for sharing!'];
        
        // ===== DRAWER =====
        const drawer = document.getElementById('drawer');
        const chatScreen = document.getElementById('chatScreen');
        const DRAWER_WIDTH = window.innerWidth;
        
        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        
        function animateDrawer(target, duration = 120) {
            if (animId) cancelAnimationFrame(animId);
            
            const start = drawer.getBoundingClientRect().left;
            const startTime = performance.now();
            const isOpening = target > start;
            
            function step(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = isOpening ? easeOutCubic(progress) : progress;
                const current = start + (target - start) * eased;
                
                drawer.style.transform = `translateX(${current}px)`;
                chatScreen.style.transform = `translateX(${current}px)`;
                
                if (progress < 1) {
                    animId = requestAnimationFrame(step);
                } else {
                    drawerOpen = isOpening;
                    if (!drawerOpen) {
                        drawer.style.transform = '';
                        chatScreen.style.transform = '';
                    }
                }
            }
            
            animId = requestAnimationFrame(step);
        }
        
        function openDrawer() { animateDrawer(0); drawerOpen = true; }
        function closeDrawer() { animateDrawer(-DRAWER_WIDTH); drawerOpen = false; }
        
        // ===== SWIPE =====
        let touchStartX = 0;
        let currentX = 0;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            currentX = drawer.getBoundingClientRect().left;
            if (animId) cancelAnimationFrame(animId);
        }, { passive: true });
        
        document.addEventListener('touchmove', (e) => {
            const touchX = e.touches[0].clientX;
            const dx = touchX - touchStartX;
            
            if (drawerOpen) {
                if (dx < 0) {
                    const x = Math.max(-DRAWER_WIDTH, dx);
                    drawer.style.transform = `translateX(${x}px)`;
                    chatScreen.style.transform = `translateX(${x}px)`;
                }
            } else {
                if (dx > 0 && touchStartX < 30) {
                    const x = Math.min(0, -DRAWER_WIDTH + dx);
                    drawer.style.transform = `translateX(${x}px)`;
                    chatScreen.style.transform = `translateX(${x}px)`;
                }
            }
        }, { passive: true });
        
        document.addEventListener('touchend', (e) => {
            const touchX = e.changedTouches[0].clientX;
            const dx = touchX - touchStartX;
            const vx = dx / (e.timeStamp - touchStartX.timeStamp || 1);
            
            if (drawerOpen) {
                if (dx < -50 || vx < -0.5) closeDrawer();
                else openDrawer();
            } else {
                if (dx > 50 || vx > 0.5) openDrawer();
                else {
                    drawer.style.transform = '';
                    chatScreen.style.transform = '';
                }
            }
        });
        
        // ===== CHAT LIST =====
        function renderChatList() {
            const list = document.getElementById('chatList');
            list.innerHTML = chats.map(chat => `
                <div class="chat-item ${chat.id === currentChatId ? 'active' : ''}" onclick="selectChat('${chat.id}')">
                    <div class="avatar">${chat.avatar}</div>
                    <div class="chat-info">
                        <div class="chat-name">${chat.name}</div>
                        <div class="chat-preview">${chat.messages[chat.messages.length-1]?.text || ''}</div>
                    </div>
                </div>
            `).join('');
        }
        
        function selectChat(id) {
            currentChatId = id;
            renderChatList();
            renderMessages();
            const chat = chats.find(c => c.id === id);
            document.getElementById('headerName').textContent = chat.name;
            closeDrawer();
        }
        
        function newChat() {
            const id = Date.now().toString();
            chats.unshift({ id, name: 'New Chat', avatar: '💬', messages: [] });
            selectChat(id);
        }
        
        // ===== MESSAGES =====
        function renderMessages() {
            const chat = chats.find(c => c.id === currentChatId);
            const container = document.getElementById('messages');
            container.innerHTML = chat.messages.map(m => `
                <div class="message ${m.isUser ? 'user' : 'ai'}">
                    <div class="bubble ${m.isUser ? 'user' : 'ai'}">${escapeHtml(m.text)}</div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function sendMessage() {
            const input = document.getElementById('input');
            const text = input.value.trim();
            if (!text) return;
            
            const chat = chats.find(c => c.id === currentChatId);
            chat.messages.push({ id: Date.now().toString(), text, isUser: true });
            input.value = '';
            renderMessages();
            renderChatList();
            
            setTimeout(() => {
                const reply = replies[Math.floor(Math.random() * replies.length)];
                chat.messages.push({ id: (Date.now()+1).toString(), text: reply, isUser: false });
                renderMessages();
                renderChatList();
            }, 1000);
        }
        
        // ===== INIT =====
        renderChatList();
        renderMessages();
    </script>
</body>
</html>
